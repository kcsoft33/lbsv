# Publishing an approved vX.Y.Z tag builds and publishes:
#   - ghcr.io/kcsoft33/lbsv:X.Y.Z and :latest (linux/amd64 + linux/arm64), with the signed Firefox build inside
#   - a GitHub release with the extension zips, the Mozilla-signed .xpi, the agent bundle and (preview) agent binaries
# Repository secrets: AMO_JWT_ISSUER, AMO_JWT_SECRET. GHCR uses the built-in GITHUB_TOKEN.
name: release
on:
  push: { tags: ["v*.*.*"] }
permissions: { contents: write, packages: write }
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/lbsv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Version matches the tag
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run typecheck && npm test
      - run: npm run build && npm run build:ext

      - name: Sign the Firefox build (unlisted on AMO; served by each hub)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_JWT_ISSUER" ]; then npm run sign:firefox && npm run build:ext; else echo "::warning::AMO secrets not set; releasing without a signed .xpi"; fi

      - name: Agent binaries (preview; Node-free)
        uses: oven-sh/setup-bun@v2
      - run: |
          mkdir -p out/bin
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "$t" = windows-x64 ] && ext=".exe"
            bun build --compile --target=bun-$t packages/agent/dist/lbsv-agent.mjs --outfile out/bin/lbsv-agent-$t$ext
          done
          ls -la out/bin

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: GitHub release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            packages/ext/dist/packages/*.zip packages/ext/dist/packages/*.xpi packages/ext/dist/packages/lbsv-agent.mjs out/bin/* 2>/dev/null \
          || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            packages/ext/dist/packages/*.zip packages/ext/dist/packages/lbsv-agent.mjs out/bin/*
